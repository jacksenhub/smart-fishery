<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" preserveAspectRatio="none">
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a2c3a"/>
      <stop offset="55%" stop-color="#0b3a4a"/>
      <stop offset="100%" stop-color="#072530"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#11596b" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#11596b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#234034"/>
      <stop offset="100%" stop-color="#163028"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- 海洋底色 -->
  <rect x="0" y="0" width="1600" height="1600" fill="url(#ocean)"/>
  <rect x="0" y="0" width="1600" height="1600" fill="url(#glow)"/>

  <!-- 经纬网格 -->
  <g stroke="#9fd9e6" stroke-opacity="0.10" stroke-width="1.5">
    <line x1="0" y1="200" x2="1600" y2="200"/>
    <line x1="0" y1="400" x2="1600" y2="400"/>
    <line x1="0" y1="600" x2="1600" y2="600"/>
    <line x1="0" y1="800" x2="1600" y2="800"/>
    <line x1="0" y1="1000" x2="1600" y2="1000"/>
    <line x1="0" y1="1200" x2="1600" y2="1200"/>
    <line x1="0" y1="1400" x2="1600" y2="1400"/>
    <line x1="200" y1="0" x2="200" y2="1600"/>
    <line x1="400" y1="0" x2="400" y2="1600"/>
    <line x1="600" y1="0" x2="600" y2="1600"/>
    <line x1="800" y1="0" x2="800" y2="1600"/>
    <line x1="1000" y1="0" x2="1000" y2="1600"/>
    <line x1="1200" y1="0" x2="1200" y2="1600"/>
    <line x1="1400" y1="0" x2="1400" y2="1600"/>
  </g>

  <!-- 等深线 -->
  <g fill="none" stroke="#3fa9c4" stroke-opacity="0.18" stroke-width="2">
    <ellipse cx="800" cy="780" rx="560" ry="540"/>
    <ellipse cx="800" cy="780" rx="400" ry="380"/>
    <ellipse cx="800" cy="780" rx="240" ry="220"/>
  </g>

  <!-- 养殖网箱阵列（耕海一号示意） -->
  <g stroke="#5fd0c9" stroke-opacity="0.35" stroke-width="2" fill="#0f6f76" fill-opacity="0.22">
    <g>
      <circle cx="640" cy="700" r="26"/>
      <circle cx="720" cy="700" r="26"/>
      <circle cx="800" cy="700" r="26"/>
      <circle cx="880" cy="700" r="26"/>
      <circle cx="960" cy="700" r="26"/>
      <circle cx="640" cy="780" r="26"/>
      <circle cx="720" cy="780" r="26"/>
      <circle cx="800" cy="780" r="26"/>
      <circle cx="880" cy="780" r="26"/>
      <circle cx="960" cy="780" r="26"/>
      <circle cx="640" cy="860" r="26"/>
      <circle cx="720" cy="860" r="26"/>
      <circle cx="800" cy="860" r="26"/>
      <circle cx="880" cy="860" r="26"/>
      <circle cx="960" cy="860" r="26"/>
    </g>
  </g>
  <text x="800" y="640" fill="#bfeef2" fill-opacity="0.55" font-family="sans-serif" font-size="26" text-anchor="middle" letter-spacing="2">智慧养殖阵列</text>

  <!-- 陆地（左上角） -->
  <path d="M0,0 L460,0 C420,120 470,210 360,300 C270,360 300,470 180,520 C90,555 60,640 0,660 Z" fill="url(#land)"/>
  <path d="M0,0 L460,0 C420,120 470,210 360,300 C270,360 300,470 180,520 C90,555 60,640 0,660 Z" fill="none" stroke="#3c6b58" stroke-opacity="0.6" stroke-width="3"/>
  <text x="120" y="120" fill="#cfe6d8" fill-opacity="0.7" font-family="sans-serif" font-size="30" letter-spacing="3">陆地</text>

  <!-- 指北针 -->
  <g transform="translate(1430,1430)">
    <circle r="74" fill="#06222c" fill-opacity="0.65" stroke="#5fd0c9" stroke-opacity="0.5" stroke-width="2"/>
    <polygon points="0,-54 12,0 0,16 -12,0" fill="#e9573f"/>
    <polygon points="0,54 12,0 0,-16 -12,0" fill="#d7eef0"/>
    <text x="0" y="-62" fill="#d7eef0" font-family="sans-serif" font-size="22" text-anchor="middle">N</text>
  </g>

  <!-- 标题 -->
  <g font-family="sans-serif">
    <text x="40" y="60" fill="#eaf6f8" font-size="34" font-weight="700" letter-spacing="2">耕海一号 · 示意海域</text>
    <text x="40" y="96" fill="#9fd9e6" fill-opacity="0.7" font-size="22" letter-spacing="1">离线底图 · 无需外网</text>
  </g>

  <!-- 暗角 -->
  <rect x="0" y="0" width="1600" height="1600" fill="black" fill-opacity="0.06" filter="url(#soft)" pointer-events="none"/>
</svg>
